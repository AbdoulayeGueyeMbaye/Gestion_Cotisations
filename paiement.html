<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saisir un paiement — Gérant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>Saisir un paiement</h1>
    <span class="role-badge">Gérant</span>
  </header>

  <nav class="app-nav">
    <a href="dashboard.html">Tableau croisé</a>
    <a href="paiement.html" class="active">Saisir paiement</a>
    <a href="#">Apprenants</a>
    <a href="#">Campagnes</a>
  </nav>

  <main class="container">
    <div class="card">
      <form action="/gerant/paiements/create" method="post">
        <input type="hidden" name="csrf_token" value="token_exemple">

        <div class="form-group">
          <label for="apprenant">Apprenant</label>
          <select id="apprenant" name="apprenant_id" required>
            <option value="">— Sélectionner —</option>
            <option value="1">Diallo Amadou</option>
            <option value="2">Sow Mariama</option>
            <option value="3">Ba Khady</option>
            <option value="4">Ndiaye Fatou</option>
          </select>
        </div>

        <div class="form-group">
          <label for="type">Type de cotisation</label>
          <select id="type" name="type_cotisation" required>
            <option value="hebdo">Cotisation hebdomadaire</option>
            <option value="anniversaire">Anniversaire (mois en cours)</option>
            <option value="deces">Don libre — Cas social / Décès</option>
          </select>
        </div>

        <div class="form-group" id="campagne-group" style="display:none;">
          <label for="campagne">Campagne</label>
          <select id="campagne" name="campagne_id">
            <option value="c1">Décès — Famille Diop (3 jours restants)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="montant">Montant reçu (FCFA)</label>
          <input type="number" id="montant" name="montant" min="1" placeholder="Ex: 15000" required>
          <p style="font-size:0.75rem; color:var(--color-text-muted); margin-top:0.35rem;">
            Hebdo : ventilation auto sur semaines impayées (5 000 FCFA/semaine)
          </p>
        </div>

        <div class="form-group">
          <label for="commentaire">Commentaire (optionnel)</label>
          <textarea id="commentaire" name="commentaire" rows="2" placeholder="Ex: Paiement S10-S12"></textarea>
        </div>

        <div class="card" style="background:#f0fdf4; border:1px solid #bbf7d0; margin-bottom:1rem;">
          <p style="font-size:0.85rem;"><strong>Aperçu ventilation</strong></p>
          <p style="font-size:0.8rem; color:var(--color-text-muted); margin-top:0.25rem;">
            Pour 15 000 FCFA → S10 ✓, S11 ✓, S12 ✓ (3 semaines)
          </p>
        </div>

        <button type="submit" class="btn btn-primary">Enregistrer le paiement</button>
        <a href="dashboard.html" class="btn btn-secondary" style="display:block; margin-top:0.5rem; width:100%;">Annuler</a>
      </form>
    </div>
  </main>

  <script>
    document.getElementById('type').addEventListener('change', function() {
      document.getElementById('campagne-group').style.display =
        this.value === 'deces' ? 'block' : 'none';
    });
  </script>
</body>
</html>
