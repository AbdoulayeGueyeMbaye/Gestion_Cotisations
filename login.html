<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Gestion des Cotisations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1>Gestion des Cotisations</h1>
      <p class="subtitle">Classe — Formation 10 mois</p>

      <form action="dashboard.html" method="get">
        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" name="email" placeholder="Veuiller entrer votre email" required>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" placeholder="Veuiller entrer votre mot de passe" required>
        </div>
        <button type="submit" class="btn btn-primary">Se connecter</button>
      </form>


      <p style="text-align:center; margin-top:1.25rem; font-size:0.85rem; color:var(--color-text-muted);">
        Pas encore inscrit ?
        <a href="#" style="color:var(--color-primary);">Auto-inscription</a>
      </p>
    </div>
  </div>
</body>
</html>
